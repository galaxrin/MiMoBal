[package]
name = "mimobal"
version = "0.2.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "image-ico", "macos-private-api"] }
tauri-plugin-notification = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip"] }
rusqlite = { version = "0.32", features = ["bundled"] }
chrono = "0.4"
dirs = "5"
arboard = "3"
tokio = { version = "1", features = ["rt", "time", "sync", "macros", "net"] }

[profile.release]
strip = true
lto = true

# 本地 patch：菜单栏 title 字号对齐 CodexBar（systemFont(systemFontSize)）
[patch.crates-io]
tray-icon = { path = "tray-icon-patch" }
