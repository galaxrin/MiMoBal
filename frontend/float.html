<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
  html, body { width: 100%; height: 100%; }
  :root { --accent: #4c8dff; }
  body {
    font-family: "PingFang SC", "Microsoft YaHei", "Segoe UI", -apple-system, sans-serif;
    /* 背景/圆角/边框放在 #card 上：body 背景会传播到视口画布（方形快速路径），
       border-radius 在该路径上不生效，圆角会时有时无 */
    background: transparent;
    color: #e8eaed;
    overflow: hidden;
  }
  #card {
    min-height: 100%;
    width: 100%;
    background: rgba(22, 24, 29, 0.96);
    border: 1px solid #2a2e36;
    border-radius: 12px;
    overflow: hidden;
  }
  /* 有旧数据但拉取失败：灰显表示数据过期 */
  #card.stale { opacity: 0.5; }
  body.alarm #card { border-color: #e06c75; }
  body::-webkit-scrollbar { width: 0; height: 0; }
  body[data-density="compact"] .row { padding: 2px 0; }
  body[data-density="compact"] .hcell .v { font-size: 15px; }
  body[data-density="compact"] header { padding: 4px 10px 0; }

  header {
    display: flex; align-items: center;
    padding: 7px 10px 2px;
  }
  header b { font-size: 10px; font-weight: 600; color: #6b7078; }

  #hero {
    display: flex; flex-wrap: nowrap; gap: 8px; padding: 4px 10px 2px;
  }
  /* basis=auto：格子按自身内容取宽，避免 flex-basis:0 平分时值被省略号截断 */
  .hcell { flex: 1 1 auto; min-width: 0; cursor: copy; }
  .hcell .k { font-size: 9px; color: #6b7078; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .hcell .v {
    font-size: 18px; font-weight: 700; line-height: 1.3;
    letter-spacing: -0.3px; white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis;
  }
  .hcell .v.red { color: #e06c75; }

  #toggle {
    text-align: center; font-size: 9px; color: #6b7078;
    padding: 1px 0 5px; cursor: pointer;
  }
  #toggle:hover { color: #8b919a; }

  #list { padding: 0 10px 2px; }
  .row {
    display: flex; justify-content: space-between; align-items: baseline;
    padding: 4px 0; border-top: 1px solid #23262d; gap: 8px; cursor: copy;
  }
  .row .k { font-size: 10px; color: #8b919a; white-space: nowrap; flex: none; }
  .row .v {
    font-size: 11px; font-weight: 600; text-align: right;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .row .v.red { color: #e06c75; }

  .err { padding: 8px 0 6px; max-width: 240px; }
  .err-main { color: #e06c75; font-size: 11px; font-weight: 600; margin-bottom: 2px; }
  .err-sub { color: #8b919a; font-size: 10px; line-height: 1.45; margin-bottom: 6px; word-break: break-word; }
  .err button {
    background: #23262d; border: 1px solid #2a2e36;
    color: #c5c9d0; border-radius: 4px; font-size: 10px; padding: 2px 10px; cursor: pointer;
  }
  .err button:hover { background: #2f3440; }
  .empty { color: #6b7078; font-size: 10px; padding: 8px 0; }
</style>
</head>
<body>
  <div id="card">
    <header data-tauri-drag-region>
      <b>MiMo</b><span id="hdrWarn" style="display:none;color:#e06c75;margin-left:4px">⚠</span>
    </header>
    <div id="hero"></div>
    <div id="toggle"></div>
    <div id="list"></div>
  </div>
<script src="bridge.js"></script>
<script>
  const heroEl = document.getElementById('hero');
  const listEl = document.getElementById('list');
  const toggleEl = document.getElementById('toggle');
  const titleEl = document.querySelector('header b');
  let entries = [];
  let cfg = null;
  let error = '';
  let stale = false;
  let expanded = localStorage.getItem('expanded') === '1';

  // 窗口尺寸 = 内容尺寸：量自然宽 + 该宽度下的高，交给主进程 setBounds
  function fitWindow() {
    requestAnimationFrame(() => {
      document.body.style.width = 'max-content';
      const w = Math.ceil(document.body.getBoundingClientRect().width);
      document.body.style.width = w + 'px';
      document.body.style.height = 'auto';
      const h = document.body.scrollHeight;
      document.body.style.width = '';
      document.body.style.height = '';
      api.setFloatSize(w, h);
    });
  }

  function applyLook() {
    const f = (cfg && cfg.float) || {};
    const op = Math.min(1, Math.max(0.3, f.opacity ?? 0.96));
    // macOS 透明窗：rgba 透明度生效
    // Windows 不透明黑底：改为卡片底色明度插值，保证滑条可感知
    // op=1 → 设计色 #16181d；op=0.3 → 更暗但仍与纯黑拉开差距
    const dark = [22, 24, 29];
    const black = [8, 9, 12];
    const t = (op - 0.3) / 0.7;
    const r = Math.round(black[0] + (dark[0] - black[0]) * t);
    const g = Math.round(black[1] + (dark[1] - black[1]) * t);
    const b = Math.round(black[2] + (dark[2] - black[2]) * t);
    const isWin = /Windows/i.test(navigator.userAgent || '');
    const card = document.getElementById('card');
    if (isWin) {
      card.style.background = `rgb(${r}, ${g}, ${b})`;
      card.style.border = `1px solid rgba(42, 46, 54, ${0.35 + op * 0.65})`;
    } else {
      card.style.background = `rgba(22, 24, 29, ${op})`;
      card.style.border = '';
    }
    document.body.dataset.density = f.density === 'compact' ? 'compact' : 'std';
    document.body.classList.toggle('alarm', entries.some((e) => e.red));
    document.getElementById('card').classList.toggle('stale', stale);
  }

  function heroEntries() {
    const ids = Array.isArray(cfg && cfg.float && cfg.float.heroIds)
      ? cfg.float.heroIds
      : [];
    const picked = [];
    for (const id of ids) {
      if (!id) continue;
      const e = entries.find((x) => x.id === id);
      // 双核心位同一字段只显示一次
      if (e && !picked.some((p) => p.id === e.id)) picked.push(e);
    }
    // 指定的核心位优先，剩余名额从已勾选字段顺位补满（横向两格）
    for (const e of entries) {
      if (picked.length >= 2) break;
      if (!picked.some((p) => p.id === e.id)) picked.push(e);
    }
    return picked;
  }

  let copyTimer = null;
  function copyText(t) {
    api.copyText(t);
    titleEl.textContent = '已复制 ✓';
    titleEl.style.color = '#4c8dff';
    clearTimeout(copyTimer); // 连续点击：旧计时器不能提前把标题改回去
    copyTimer = setTimeout(() => {
      titleEl.textContent = 'MiMo';
      titleEl.style.color = '';
    }, 900);
  }

  function renderInner() {
    applyLook();
    document.getElementById('hdrWarn').style.display = error ? '' : 'none';
    heroEl.innerHTML = '';
    listEl.innerHTML = '';
    const mode = (cfg && cfg.float && cfg.float.mode) || 'full';
    const mini = mode === 'mini';

    toggleEl.style.display = mini ? 'none' : '';
    listEl.style.display = mini ? 'none' : '';

    if (error && !entries.length) {
      const cred = /凭证已失效|登录验证|passToken|EXPIRED|70016|未找到小米账号/.test(error);
      const errDiv = document.createElement('div');
      errDiv.className = 'err';
      const main = document.createElement('div');
      main.className = 'err-main';
      main.textContent = cred ? '⚠ 登录凭证已失效' : '⚠ 数据获取失败';
      const sub = document.createElement('div');
      sub.className = 'err-sub';
      sub.textContent = cred
        ? '请在 MiMo Desktop 重新登录后，点「重试」刷新'
        : error;
      const btn = document.createElement('button');
      btn.textContent = '重试';
      btn.onclick = (e) => {
        e.stopPropagation();
        btn.disabled = true;
        btn.textContent = '重试中…';
        api.refreshNow().catch(() => { btn.disabled = false; btn.textContent = '重试'; });
      };
      errDiv.append(main, sub, btn);
      heroEl.appendChild(errDiv);
      toggleEl.textContent = '';
      return;
    }
    if (!entries.length) {
      heroEl.innerHTML = '<div class="empty">未勾选字段 · 点 ⚙ 设置</div>';
      return;
    }

    const heroes = mini ? heroEntries().slice(0, 1) : heroEntries().slice(0, 2);
    for (const e of heroes) {
      const cell = document.createElement('div');
      cell.className = 'hcell';
      cell.innerHTML = '<div class="k"></div><div class="v"></div>';
      cell.querySelector('.k').textContent = e.label;
      const v = cell.querySelector('.v');
      v.textContent = e.text;
      if (e.red) v.classList.add('red');
      cell.onclick = () => copyText(e.text);
      heroEl.appendChild(cell);
    }

    if (!mini) {
      toggleEl.textContent = expanded ? '▴ 收起' : `▾ 全部 ${entries.length} 项`;
      if (expanded) {
        for (const e of entries) {
          const row = document.createElement('div');
          row.className = 'row';
          row.innerHTML = '<span class="k"></span><span class="v"></span>';
          row.querySelector('.k').textContent = e.label;
          const v = row.querySelector('.v');
          v.textContent = e.text + (e.red ? ' ⚠' : '');
          if (e.red) v.classList.add('red');
          row.onclick = () => copyText(e.text + (e.red ? ' ⚠' : ''));
          listEl.appendChild(row);
        }
      }
    }
  }

  // 每次渲染后窗口重新贴合内容尺寸
  function render() {
    renderInner();
    fitWindow();
  }

  toggleEl.onclick = (e) => {
    e.stopPropagation();
    expanded = !expanded;
    localStorage.setItem('expanded', expanded ? '1' : '0');
    render();
  };

  function onState(s) {
    entries = s.entries;
    cfg = s.config;
    error = s.error || '';
    stale = !!s.stale;
    render();
  }
  api.onState(onState);
  api.getState().then(onState);
</script>
</body>
</html>
