name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: ""
          - platform: windows-latest
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install frontend deps
        run: npm install

      - name: Build and upload release assets
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: MiMoBal ${{ github.ref_name }}
          releaseBody: |
            Rust (Tauri 2) 重写版。
            - macOS：`MiMoBal_*.dmg`（Apple Silicon）
            - Windows：`MiMoBal_Setup_*.exe`
          args: ${{ matrix.args }}

  prune-assets:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Keep only dmg and setup.exe
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          REPO="${GITHUB_REPOSITORY}"
          for a in $(gh release view "$TAG" -R "$REPO" --json assets --jq '.assets[].name'); do
            case "$a" in
              *.dmg|*-setup.exe) ;;
              *) gh release delete-asset "$TAG" "$a" -y -R "$REPO" ;;
            esac
          done
          gh release view "$TAG" -R "$REPO" --json assets --jq '.assets[].name'
