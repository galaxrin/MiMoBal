<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
  html, body { width: 100%; height: 100%; }
  :root { --accent: #4c8dff; }
  body {
    font-family: "PingFang SC", "Microsoft YaHei", "Segoe UI", -apple-system, sans-serif;
    background: rgba(22, 24, 29, 0.96);
    color: #e8eaed;
    border-radius: 12px;
    border: 1px solid #2a2e36;
    overflow-y: auto;
    overflow-x: hidden;
  }
  body.alarm { border-color: #e06c75; }
  body::-webkit-scrollbar { width: 0; height: 0; }
  body[data-density="compact"] .row { padding: 2px 0; }
  body[data-density="compact"] .hcell .v { font-size: 15px; }
  body[data-density="compact"] header { padding: 4px 10px 0; }

  header {
    -webkit-app-region: drag;
    display: flex; align-items: center;
    padding: 7px 10px 2px;
  }
  header b { font-size: 10px; font-weight: 600; color: #6b7078; }

  #hero {
    -webkit-app-region: no-drag;
    display: flex; flex-wrap: nowrap; gap: 8px; padding: 4px 10px 2px;
  }
  .hcell { flex: 1 1 0; min-width: 0; cursor: copy; }
  .hcell .k { font-size: 9px; color: #6b7078; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .hcell .v {
    font-size: 18px; font-weight: 700; line-height: 1.3;
    letter-spacing: -0.3px; white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis;
  }
  .hcell .v.red { color: #e06c75; }

  #sparkWrap { margin: 4px 10px 0; }
  #spark { display: block; width: 100%; height: 28px; }

  #toggle {
    text-align: center; font-size: 9px; color: #6b7078;
    padding: 1px 0 5px; cursor: pointer;
  }
  #toggle:hover { color: #8b919a; }

  #list { padding: 0 10px 2px; }
  .row {
    display: flex; justify-content: space-between; align-items: baseline;
    padding: 4px 0; border-top: 1px solid #23262d; gap: 8px; cursor: copy;
  }
  .row .k { font-size: 10px; color: #8b919a; white-space: nowrap; flex: none; }
  .row .v {
    font-size: 11px; font-weight: 600; text-align: right;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .row .v.red { color: #e06c75; }

  .err { color: #e06c75; font-size: 10px; padding: 6px 0; }
  .empty { color: #6b7078; font-size: 10px; padding: 6px 0; }
</style>
</head>
<body>
  <header>
    <b>MiMo</b>
  </header>
  <div id="hero"></div>
  <div id="sparkWrap"><canvas id="spark"></canvas></div>
  <div id="toggle"></div>
  <div id="list"></div>
<script>
  const heroEl = document.getElementById('hero');
  const listEl = document.getElementById('list');
  const toggleEl = document.getElementById('toggle');
  const titleEl = document.querySelector('header b');
  const sparkEl = document.getElementById('spark');
  let entries = [];
  let history = [];
  let cfg = null;
  let error = '';
  let expanded = localStorage.getItem('expanded') === '1';

  // 窗口尺寸 = 内容尺寸：量自然宽 + 该宽度下的高，交给主进程 setBounds
  function fitWindow() {
    requestAnimationFrame(() => {
      document.body.style.width = 'max-content';
      const w = Math.ceil(document.body.getBoundingClientRect().width);
      document.body.style.width = w + 'px';
      document.body.style.height = 'auto';
      const h = document.body.scrollHeight;
      document.body.style.width = '';
      document.body.style.height = '';
      api.setFloatSize(w, h);
    });
  }

  function applyLook() {
    const f = (cfg && cfg.float) || {};
    document.body.style.background = `rgba(22, 24, 29, ${f.opacity ?? 0.96})`;
    document.body.dataset.density = f.density === 'compact' ? 'compact' : 'std';
    document.body.classList.toggle('alarm', entries.some((e) => e.red));
  }

  function heroEntries() {
    const ids = (cfg && cfg.float && cfg.float.heroIds) || [];
    const picked = ids
      .filter(Boolean)
      .map((id) => entries.find((e) => e.id === id))
      .filter(Boolean);
    // 指定的核心位优先，剩余名额从已勾选字段顺位补满（横向两格）
    for (const e of entries) {
      if (picked.length >= 2) break;
      if (!picked.includes(e)) picked.push(e);
    }
    return picked;
  }

  function drawSpark() {
    const mode = (cfg && cfg.float && cfg.float.mode) || 'full';
    const show = mode === 'full' && history.length >= 2;
    document.getElementById('sparkWrap').style.display = show ? '' : 'none';
    if (!show) return;
    const dpr = 2;
    const W = Math.max(80, Math.round(sparkEl.clientWidth) || 210);
    const H = 28;
    sparkEl.width = W * dpr;
    sparkEl.height = H * dpr;
    const ctx = sparkEl.getContext('2d');
    ctx.scale(dpr, dpr);
    const vals = history.map((p) => p.v);
    const min = Math.min(...vals), max = Math.max(...vals);
    const span = max - min || 1;
    const pad = 4;
    const pts = history.map((p, i) => [
      pad + (i * (W - pad * 2)) / (history.length - 1),
      H - pad - ((p.v - min) / span) * (H - pad * 2),
    ]);
    const accent = '#4c8dff';
    ctx.clearRect(0, 0, W, H);
    ctx.strokeStyle = accent;
    ctx.lineWidth = 1.5;
    ctx.lineJoin = 'round';
    ctx.beginPath();
    pts.forEach(([x, y], i) => (i ? ctx.lineTo(x, y) : ctx.moveTo(x, y)));
    ctx.stroke();
    const [lx, ly] = pts[pts.length - 1];
    ctx.fillStyle = accent;
    ctx.beginPath();
    ctx.arc(lx, ly, 2.5, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#6b7078';
    ctx.font = '8px "PingFang SC", "Microsoft YaHei"';
    ctx.fillText(`7日 ${vals[0].toFixed(2)} → ${vals[vals.length - 1].toFixed(2)}`, pad, 8);
  }

  function copyText(t) {
    api.copyText(t);
    titleEl.textContent = '已复制 ✓';
    titleEl.style.color = '#4c8dff';
    setTimeout(() => {
      titleEl.textContent = 'MiMo';
      titleEl.style.color = '';
    }, 900);
  }

  function renderInner() {
    applyLook();
    heroEl.innerHTML = '';
    listEl.innerHTML = '';
    const mode = (cfg && cfg.float && cfg.float.mode) || 'full';
    const mini = mode === 'mini';

    toggleEl.style.display = mini ? 'none' : '';
    listEl.style.display = mini ? 'none' : '';

    if (error && !entries.length) {
      heroEl.innerHTML = `<div class="err">⚠ ${error}</div>`;
      toggleEl.textContent = '';
      document.getElementById('sparkWrap').style.display = 'none';
      return;
    }
    if (!entries.length) {
      heroEl.innerHTML = '<div class="empty">未勾选字段，点 ⚙ 设置</div>';
      document.getElementById('sparkWrap').style.display = 'none';
      return;
    }

    const heroes = mini ? heroEntries().slice(0, 1) : heroEntries().slice(0, 2);
    for (const e of heroes) {
      const cell = document.createElement('div');
      cell.className = 'hcell';
      cell.innerHTML = '<div class="k"></div><div class="v"></div>';
      cell.querySelector('.k').textContent = e.label;
      const v = cell.querySelector('.v');
      v.textContent = e.text;
      if (e.red) v.classList.add('red');
      cell.onclick = () => copyText(e.text);
      heroEl.appendChild(cell);
    }

    drawSpark();

    if (!mini) {
      toggleEl.textContent = expanded ? '▴ 收起' : `▾ 全部 ${entries.length} 项`;
      if (expanded) {
        for (const e of entries) {
          const row = document.createElement('div');
          row.className = 'row';
          row.innerHTML = '<span class="k"></span><span class="v"></span>';
          row.querySelector('.k').textContent = e.label;
          const v = row.querySelector('.v');
          v.textContent = e.text + (e.red ? ' ⚠' : '');
          if (e.red) v.classList.add('red');
          row.onclick = () => copyText(e.text + (e.red ? ' ⚠' : ''));
          listEl.appendChild(row);
        }
      }
    }
  }

  // 每次渲染后窗口重新贴合内容尺寸
  function render() {
    renderInner();
    fitWindow();
  }

  // 窗口尺寸变化后按新宽度重绘 sparkline
  window.addEventListener('resize', () => drawSpark());

  toggleEl.onclick = (e) => {
    e.stopPropagation();
    expanded = !expanded;
    localStorage.setItem('expanded', expanded ? '1' : '0');
    render();
  };

  function onState(s) {
    entries = s.entries;
    history = s.history || [];
    cfg = s.config;
    error = s.error || '';
    render();
  }
  api.onState(onState);
  api.getState().then(onState);
</script>
</body>
</html>
